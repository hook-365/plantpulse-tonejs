<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlantPulse · Live</title>
  <link href="https://fonts.googleapis.com/css2?family=Cookie&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #030508;
      font-family: 'Share Tech Mono', monospace;
      color: #e8ecf4;
      user-select: none;
    }

    #bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    /* Scanline overlay — oscilloscope feel */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.055) 2px,
        rgba(0,0,0,0.055) 4px
      );
      pointer-events: none;
      z-index: 100;
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: 40px 52px 36px;
      pointer-events: none;
    }

    /* ── TOP ── */
    .top-bar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }

    .plant-identity { display: flex; flex-direction: column; gap: 2px; }

    .plant-name {
      font-family: 'Cookie', cursive;
      font-size: clamp(48px, 6vw, 88px);
      font-weight: 400;
      color: #e8ecf4;
      line-height: 1;
      text-shadow:
        0 0 40px rgba(52,211,153,0.22),
        0 0 90px rgba(52,211,153,0.08);
      letter-spacing: -1px;
    }

    .plant-type {
      font-size: clamp(9px, 1vw, 13px);
      color: #d4956a;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-left: 3px;
      margin-top: 4px;
    }

    .top-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 14px;
    }

    .live-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px 6px 12px;
      border: 1px solid rgba(52,211,153,0.3);
      border-radius: 3px;
      background: rgba(52,211,153,0.05);
      font-size: 11px;
      letter-spacing: 3px;
      color: #34d399;
    }

    .live-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #34d399;
      flex-shrink: 0;
      animation: pulse-live 1.8s ease-in-out infinite;
    }

    @keyframes pulse-live {
      0%,100% { opacity:1; box-shadow: 0 0 0 0 rgba(52,211,153,0.5); }
      50%      { opacity:0.7; box-shadow: 0 0 0 5px rgba(52,211,153,0); }
    }

    .channel-status { display: flex; gap: 10px; }

    .ch-pill {
      display: flex; align-items: center; gap: 5px;
      padding: 3px 10px;
      border-radius: 3px;
      border: 1px solid rgba(255,255,255,0.05);
      background: rgba(255,255,255,0.02);
      font-size: 9px; letter-spacing: 1.5px;
      color: #2a3450;
      transition: all 0.6s ease;
    }

    .ch-pill.active          { border-color: rgba(52,211,153,0.35);  background: rgba(52,211,153,0.07);  color: #34d399; }
    .ch-pill.active.ch2      { border-color: rgba(110,168,254,0.35); background: rgba(110,168,254,0.07); color: #6ea8fe; }
    .ch-pill.active.ch3      { border-color: rgba(244,114,182,0.35); background: rgba(244,114,182,0.07); color: #f472b6; }

    .ch-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: 0.4; }
    .ch-pill.active .ch-dot { opacity: 1; }

    /* ── CENTER spacer ── */
    .center { flex: 1; }

    /* ── BOTTOM ── */
    .bottom-bar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: end;
      gap: 24px;
    }

    .signal-stats { display: flex; gap: 24px; }

    .stat { display: flex; flex-direction: column; gap: 3px; }
    .stat-label {
      font-size: 8px; letter-spacing: 2px;
      color: #2a3450; text-transform: uppercase;
    }
    .stat-value {
      font-size: clamp(11px, 1.3vw, 16px);
      color: #4a5878;
      font-variant-numeric: tabular-nums;
      transition: color 0.4s;
    }
    .stat-value.hot { color: #34d399; }

    .activity-wrap {
      display: flex; flex-direction: column;
      align-items: center; gap: 7px;
      min-width: 240px;
    }

    .activity-label {
      font-size: 8px; letter-spacing: 3px;
      color: #2a3450; text-transform: uppercase;
    }

    .activity-track {
      width: 100%; height: 2px;
      background: rgba(255,255,255,0.05);
      border-radius: 1px; overflow: hidden;
    }

    .activity-fill {
      height: 100%; width: 0%;
      border-radius: 1px;
      transition: width 0.2s ease-out;
      background: linear-gradient(90deg, #34d399, #6ea8fe);
    }

    .activity-pct {
      font-size: 10px; color: #3a4a6a;
      letter-spacing: 1px;
      font-variant-numeric: tabular-nums;
    }

    .tagline {
      display: flex; flex-direction: column;
      align-items: flex-end; gap: 4px;
    }

    .tagline-main {
      font-size: clamp(8px, 0.9vw, 11px);
      letter-spacing: 2.5px; color: #1e2d48;
      text-transform: uppercase;
    }

    .tagline-url {
      font-size: clamp(7px, 0.8vw, 9px);
      letter-spacing: 2px; color: #141e30;
    }

    /* ── Floating signal readout ── */
    .signal-display {
      position: fixed;
      left: 52px; top: 50%;
      transform: translateY(-50%);
      z-index: 10;
      display: flex; flex-direction: column; gap: 2px;
    }

    .signal-big {
      font-size: clamp(20px, 2.6vw, 36px);
      font-variant-numeric: tabular-nums;
      color: rgba(52,211,153,0.45);
      letter-spacing: -0.5px; line-height: 1;
      transition: color 0.15s;
    }
    .signal-big.spike { color: rgba(52,211,153,0.9); }

    .signal-unit {
      font-size: 8px; letter-spacing: 2px; color: #1e2d48;
    }

    .signal-ema {
      font-size: clamp(11px, 1.2vw, 15px);
      color: rgba(212,149,106,0.4);
      font-variant-numeric: tabular-nums;
      margin-top: 8px;
    }

    /* ── Stagger in ── */
    @keyframes fade-up {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .plant-identity  { animation: fade-up 1.2s ease both; }
    .top-right       { animation: fade-up 1.2s ease 0.2s both; }
    .signal-display  { animation: fade-up 1.2s ease 0.4s both; }
    .bottom-bar      { animation: fade-up 1.2s ease 0.6s both; }
  </style>
</head>
<body>

<canvas id="bg"></canvas>

<div class="overlay">
  <div class="top-bar">
    <div class="plant-identity">
      <div class="plant-name" id="plantName">PlantPulse</div>
      <div class="plant-type" id="plantType">Bioelectrical Sonification</div>
    </div>
    <div class="top-right">
      <div class="live-badge">
        <div class="live-dot" id="liveDot"></div>
        <span id="liveText">CONNECTING</span>
      </div>
      <div class="channel-status">
        <div class="ch-pill ch1" id="pill-ch1"><div class="ch-dot"></div>CLIPS A</div>
        <div class="ch-pill ch2" id="pill-ch2"><div class="ch-dot"></div>CLIPS B</div>
        <div class="ch-pill ch3" id="pill-ch3"><div class="ch-dot"></div>TRUNK</div>
      </div>
    </div>
  </div>

  <div class="center"></div>

  <div class="bottom-bar">
    <div class="signal-stats">
      <div class="stat">
        <div class="stat-label">Min</div>
        <div class="stat-value" id="statMin">--</div>
      </div>
      <div class="stat">
        <div class="stat-label">Max</div>
        <div class="stat-value" id="statMax">--</div>
      </div>
      <div class="stat">
        <div class="stat-label">Avg</div>
        <div class="stat-value" id="statAvg">--</div>
      </div>
    </div>

    <div class="activity-wrap">
      <div class="activity-label">Bioelectrical Activity</div>
      <div class="activity-track">
        <div class="activity-fill" id="actFill"></div>
      </div>
      <div class="activity-pct" id="actPct">0.0%</div>
    </div>

    <div class="tagline">
      <div class="tagline-main">Living signal → music</div>
      <div class="tagline-url">plantpulse.hook.technology</div>
    </div>
  </div>
</div>

<div class="signal-display">
  <div class="signal-big" id="sigBig">--</div>
  <div class="signal-unit">mV raw</div>
  <div class="signal-ema" id="sigEma">-- mV smooth</div>
</div>

<script>
// ─── Constants ────────────────────────────────────────────────────────────────
const TEAL  = '#34d399';
const AMBER = '#d4956a';
const BLUE  = '#6ea8fe';
const PINK  = '#f472b6';

const POLAR_SIZE  = 512;
const SCROLL_SIZE = 400;
const PTCL_COUNT  = 55;

// ─── Canvas ───────────────────────────────────────────────────────────────────
const canvas = document.getElementById('bg');
const ctx    = canvas.getContext('2d');
let W, H, cx, cy;

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W / 2; cy = H / 2;
}
resize();
window.addEventListener('resize', resize);

// ─── Signal state ─────────────────────────────────────────────────────────────
const polarBuf  = new Float32Array(POLAR_SIZE);
const scrollBuf = new Float32Array(SCROLL_SIZE);
let polarHead   = 0;
let scrollHead  = 0;

let rawMv   = 0, emaMv = 0, emaInit = false;
let activity = 0;
let sigMin = Infinity, sigMax = -Infinity, sigSum = 0, sigCount = 0;
let lastRaw = 0;
const EMA_A = 0.08;
let rawWin  = [];
const WIN   = 5;

const chSeen = { ch1: false, ch2: false, ch3: false };

// ─── Particles ────────────────────────────────────────────────────────────────
function makeParticle() {
  const a = Math.random() * Math.PI * 2;
  const r = Math.random() * Math.min(500, Math.min(W, H) * 0.42);
  return {
    x: Math.cos(a) * r, y: Math.sin(a) * r,
    vx: (Math.random() - 0.5) * 0.22,
    vy: (Math.random() - 0.5) * 0.22,
    size: 0.7 + Math.random() * 1.6,
    opacity: 0.06 + Math.random() * 0.22,
    phase: Math.random() * Math.PI * 2,
    speed: 0.003 + Math.random() * 0.006,
    color: [TEAL, BLUE, AMBER][Math.floor(Math.random() * 3)],
  };
}

const particles = Array.from({ length: PTCL_COUNT }, makeParticle);

function tickParticles() {
  const an = Math.min(1, activity / 55);
  const edge = Math.min(W, H) * 0.46;
  particles.forEach(p => {
    p.phase += p.speed * (1 + an * 3.5);
    p.x += p.vx * (1 + an * 2.2);
    p.y += p.vy * (1 + an * 2.2);
    p.x += -p.x * 0.0005;
    p.y += -p.y * 0.0005;
    const d = Math.hypot(p.x, p.y);
    if (d > edge) { p.x *= (edge / d) * 0.93; p.y *= (edge / d) * 0.93; p.vx *= -0.75; p.vy *= -0.75; }
    p.opacity = 0.05 + Math.abs(Math.sin(p.phase)) * (0.12 + an * 0.22);
  });
}

function drawParticles() {
  particles.forEach(p => {
    ctx.beginPath();
    ctx.arc(cx + p.x, cy + p.y, p.size, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.opacity;
    ctx.fill();
  });
  ctx.globalAlpha = 1;
}

// ─── Polar bloom ──────────────────────────────────────────────────────────────
let bloomRot = 0;

function drawBloom() {
  const an    = Math.min(1, activity / 75);
  const baseR = Math.min(W, H) * (0.16 + an * 0.045);
  const swing = Math.min(W, H) * 0.135;

  // normalize buffer
  let lo = Infinity, hi = -Infinity;
  for (let i = 0; i < POLAR_SIZE; i++) {
    if (polarBuf[i] < lo) lo = polarBuf[i];
    if (polarBuf[i] > hi) hi = polarBuf[i];
  }
  const rng = hi - lo || 0.001;

  bloomRot += 0.00045 + an * 0.001;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(bloomRot);

  // --- outer glow ---
  ctx.beginPath();
  for (let i = 0; i <= POLAR_SIZE; i++) {
    const s = (polarBuf[(polarHead + i) % POLAR_SIZE] - lo) / rng - 0.5;
    const a = (i / POLAR_SIZE) * Math.PI * 2;
    const r = baseR + s * swing * 1.5;
    i === 0 ? ctx.moveTo(r * Math.cos(a), r * Math.sin(a))
            : ctx.lineTo(r * Math.cos(a), r * Math.sin(a));
  }
  ctx.closePath();
  ctx.strokeStyle = `rgba(52,211,153,${0.035 + an * 0.055})`;
  ctx.lineWidth = 20;
  ctx.filter = 'blur(20px)';
  ctx.stroke();
  ctx.filter = 'none';

  // --- primary teal ring ---
  ctx.beginPath();
  for (let i = 0; i <= POLAR_SIZE; i++) {
    const s = (polarBuf[(polarHead + i) % POLAR_SIZE] - lo) / rng - 0.5;
    const a = (i / POLAR_SIZE) * Math.PI * 2;
    const r = baseR + s * swing;
    i === 0 ? ctx.moveTo(r * Math.cos(a), r * Math.sin(a))
            : ctx.lineTo(r * Math.cos(a), r * Math.sin(a));
  }
  ctx.closePath();
  ctx.strokeStyle = `rgba(52,211,153,${0.5 + an * 0.4})`;
  ctx.lineWidth   = 1.5;
  ctx.shadowColor = TEAL;
  ctx.shadowBlur  = 14 + an * 22;
  ctx.stroke();
  ctx.shadowBlur  = 0;

  // --- inner amber ring (counter-rotate, smaller) ---
  ctx.rotate(-bloomRot * 2.4);
  ctx.beginPath();
  for (let i = 0; i <= POLAR_SIZE; i++) {
    const s = (polarBuf[(polarHead + i) % POLAR_SIZE] - lo) / rng - 0.5;
    const a = (i / POLAR_SIZE) * Math.PI * 2;
    const r = baseR * 0.6 + s * swing * 0.48;
    i === 0 ? ctx.moveTo(r * Math.cos(a), r * Math.sin(a))
            : ctx.lineTo(r * Math.cos(a), r * Math.sin(a));
  }
  ctx.closePath();
  ctx.strokeStyle = `rgba(212,149,106,${0.22 + an * 0.28})`;
  ctx.lineWidth   = 1;
  ctx.shadowColor = AMBER;
  ctx.shadowBlur  = 8 + an * 14;
  ctx.stroke();
  ctx.shadowBlur  = 0;

  ctx.restore();
}

// ─── Scrolling waveform ───────────────────────────────────────────────────────
function drawScrollWave() {
  const an   = Math.min(1, activity / 75);
  const wH   = H * 0.10;
  const wY   = H * 0.82;
  const wW   = W * 0.70;
  const wX   = (W - wW) / 2;

  let lo = Infinity, hi = -Infinity;
  for (let i = 0; i < SCROLL_SIZE; i++) {
    if (scrollBuf[i] < lo) lo = scrollBuf[i];
    if (scrollBuf[i] > hi) hi = scrollBuf[i];
  }
  const rng = hi - lo || 0.001;

  // glow
  ctx.beginPath();
  for (let i = 0; i < SCROLL_SIZE; i++) {
    const norm = (scrollBuf[(scrollHead + i) % SCROLL_SIZE] - lo) / rng;
    const x = wX + (i / (SCROLL_SIZE - 1)) * wW;
    const y = wY + (0.5 - norm) * wH;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.strokeStyle = `rgba(52,211,153,${0.07 + an * 0.09})`;
  ctx.lineWidth   = 9;
  ctx.filter      = 'blur(7px)';
  ctx.stroke();
  ctx.filter      = 'none';

  // crisp gradient stroke
  ctx.beginPath();
  for (let i = 0; i < SCROLL_SIZE; i++) {
    const norm = (scrollBuf[(scrollHead + i) % SCROLL_SIZE] - lo) / rng;
    const x = wX + (i / (SCROLL_SIZE - 1)) * wW;
    const y = wY + (0.5 - norm) * wH;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  const gr = ctx.createLinearGradient(wX, 0, wX + wW, 0);
  gr.addColorStop(0,    'rgba(52,211,153,0)');
  gr.addColorStop(0.12, `rgba(52,211,153,${0.45 + an * 0.45})`);
  gr.addColorStop(0.88, `rgba(110,168,254,${0.45 + an * 0.45})`);
  gr.addColorStop(1,    'rgba(110,168,254,0)');
  ctx.strokeStyle = gr;
  ctx.lineWidth   = 1.5;
  ctx.shadowColor = TEAL;
  ctx.shadowBlur  = 9 + an * 15;
  ctx.stroke();
  ctx.shadowBlur  = 0;

  // baseline
  ctx.beginPath();
  ctx.moveTo(wX, wY); ctx.lineTo(wX + wW, wY);
  ctx.strokeStyle = 'rgba(255,255,255,0.025)';
  ctx.lineWidth   = 1;
  ctx.stroke();
}

// ─── Background ───────────────────────────────────────────────────────────────
let bgPhase = 0;

function drawBg() {
  bgPhase += 0.003;
  const an    = Math.min(1, activity / 55);
  const pulse = 0.5 + 0.5 * Math.sin(bgPhase);

  ctx.fillStyle = '#030508';
  ctx.fillRect(0, 0, W, H);

  const c1 = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.min(W, H) * 0.54);
  c1.addColorStop(0, `rgba(52,211,153,${0.016 + an * 0.022 + pulse * 0.006})`);
  c1.addColorStop(0.5, `rgba(20,80,55,${0.006 + an * 0.010})`);
  c1.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = c1; ctx.fillRect(0, 0, W, H);

  const c2 = ctx.createRadialGradient(W * 0.14, H * 0.86, 0, W * 0.14, H * 0.86, H * 0.38);
  c2.addColorStop(0, `rgba(212,149,106,${0.010 + an * 0.013})`);
  c2.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = c2; ctx.fillRect(0, 0, W, H);

  const c3 = ctx.createRadialGradient(W * 0.87, H * 0.09, 0, W * 0.87, H * 0.09, H * 0.32);
  c3.addColorStop(0, `rgba(110,168,254,${0.008 + an * 0.010})`);
  c3.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = c3; ctx.fillRect(0, 0, W, H);
}

// ─── Render loop ──────────────────────────────────────────────────────────────
function frame() {
  drawBg();
  tickParticles();
  drawParticles();
  drawBloom();
  drawScrollWave();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ─── Signal processing ────────────────────────────────────────────────────────
let lastDomTs = 0;

function ingest(mv, ch) {
  rawWin.push(mv);
  if (rawWin.length > WIN) rawWin.shift();
  const avg = rawWin.reduce((a, b) => a + b, 0) / rawWin.length;

  if (!emaInit) { emaMv = avg; emaInit = true; }
  else emaMv = EMA_A * avg + (1 - EMA_A) * emaMv;

  if (avg < sigMin) sigMin = avg;
  if (avg > sigMax) sigMax = avg;
  sigSum += avg; sigCount++;

  const delta = Math.abs(avg - lastRaw);
  lastRaw = avg;
  activity += (Math.min(100, (delta / 15) * 100) - activity) * 0.25;

  scrollBuf[scrollHead % SCROLL_SIZE] = avg; scrollHead++;
  polarBuf[polarHead % POLAR_SIZE]    = avg; polarHead++;
  rawMv = avg;

  chSeen[ch] = true;

  const now = Date.now();
  if (now - lastDomTs > 80) { updateDOM(); lastDomTs = now; }
}

function updateDOM() {
  const $ = id => document.getElementById(id);

  $('sigBig').textContent = rawMv.toFixed(3) + ' mV';
  $('sigBig').className   = 'signal-big' + (activity > 28 ? ' spike' : '');
  $('sigEma').textContent = emaMv.toFixed(3) + ' mV smooth';

  $('actFill').style.width = Math.min(100, activity).toFixed(1) + '%';
  $('actPct').textContent  = activity.toFixed(1) + '%';

  if (sigMin !== Infinity) {
    $('statMin').textContent = sigMin.toFixed(2) + ' mV';
    $('statMax').textContent = sigMax.toFixed(2) + ' mV';
    $('statMin').className   = 'stat-value' + (activity > 18 ? ' hot' : '');
  }
  if (sigCount > 0) $('statAvg').textContent = (sigSum / sigCount).toFixed(3) + ' mV';

  ['ch1','ch2','ch3'].forEach(ch => {
    const el = document.getElementById('pill-' + ch);
    if (el) el.classList.toggle('active', chSeen[ch]);
  });
}

// ─── SSE ──────────────────────────────────────────────────────────────────────
let es, watchdog, lastMsg = 0;

function connect() {
  const $ = id => document.getElementById(id);
  $('liveText').textContent = 'CONNECTING';

  es = new EventSource('/api/stream');

  es.onopen = () => {
    lastMsg = Date.now();
    $('liveText').textContent = 'LIVE';
  };

  es.onmessage = e => {
    lastMsg = Date.now();
    try {
      const msg = JSON.parse(e.data);
      if (msg.hb) return;
      if (msg.ch && msg.v !== undefined) ingest(parseFloat(msg.v) * 1000, msg.ch);
    } catch (_) {}
  };

  es.onerror = () => {
    $('liveText').textContent = 'RECONNECTING';
    if (es.readyState === EventSource.CLOSED) setTimeout(connect, 2500);
  };

  clearInterval(watchdog);
  watchdog = setInterval(() => {
    if (Date.now() - lastMsg > 12000) { es.close(); connect(); }
  }, 3000);
}

connect();

// ─── Config ───────────────────────────────────────────────────────────────────
fetch('/config.json')
  .then(r => r.ok ? r.json() : null)
  .then(cfg => {
    if (!cfg) return;
    const $ = id => document.getElementById(id);
    if (cfg.plantName) $('plantName').textContent = cfg.plantName;
    if (cfg.plantType) $('plantType').textContent = cfg.plantType;
  })
  .catch(() => {});
</script>
</body>
</html>
