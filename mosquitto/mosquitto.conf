# The bundled broker (docker compose --profile broker). One listener, password
# required: make the password file once with tools/broker-password (it runs:
#   docker compose run --rm mosquitto mosquitto_passwd -c -b /mosquitto/config/passwd plantpulse "$MQTT_PASS"
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
persistence true
persistence_location /mosquitto/data/
