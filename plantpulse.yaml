esphome:
  name: plantpulse
  friendly_name: PlantPulse

esp32:
  board: esp32dev
  framework:
    type: arduino

# WiFi
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "PlantPulse Fallback"
    password: !secret fallback_ap_password

captive_portal:

logger:
  level: WARN

ota:
  - platform: esphome
    password: !secret ota_password

# MQTT — publish raw ADC readings, broker handles distribution
mqtt:
  broker: !secret mqtt_broker      # the machine running docker compose, or your own broker
  port: 1883
  topic_prefix: plantpulse
  username: !secret mqtt_username
  password: !secret mqtt_password

# I2C bus for ADS1115
i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true

# ADS1115 16-bit ADC with PGA
# Chip 1 (ADDR→GND): alligator clips. One chip is the default build.
ads1115:
  - address: 0x48
    id: ads_clips
  # Optional second chip (ADDR→VDD), e.g. for TENS sticky pads on a second
  # plant or a second site on the same plant. Uncomment here and the
  # "Plant Signal 3" sensor below.
  # - address: 0x49
  #   id: ads_pads

sensor:
  # Chip 1 (0x48), differential A0-A1 — alligator clips (original)
  - platform: ads1115
    ads1115_id: ads_clips
    multiplexer: 'A0_A1'
    gain: 0.256
    name: "Plant Signal"
    id: plant_signal
    update_interval: 250ms
    unit_of_measurement: "V"
    accuracy_decimals: 6

  # Chip 1 (0x48), differential A2-A3 — alligator clips (second pair)
  - platform: ads1115
    ads1115_id: ads_clips
    multiplexer: 'A2_A3'
    gain: 0.256
    name: "Plant Signal 2"
    id: plant_signal_2
    update_interval: 250ms
    unit_of_measurement: "V"
    accuracy_decimals: 6

  # Chip 2 (0x49), differential A0-A1 — optional (see ads1115 above)
  # - platform: ads1115
  #   ads1115_id: ads_pads
  #   multiplexer: 'A0_A1'
  #   gain: 0.256
  #   name: "Plant Signal 3"
  #   id: plant_signal_3
  #   update_interval: 250ms
  #   unit_of_measurement: "V"
  #   accuracy_decimals: 6
