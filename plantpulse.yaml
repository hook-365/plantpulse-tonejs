esphome:
  name: plantpulse
  friendly_name: PlantPulse

esp32:
  board: esp32dev
  framework:
    type: arduino

# WiFi
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "PlantPulse Fallback"
    password: !secret fallback_ap_password

captive_portal:

logger:
  level: WARN

ota:
  - platform: esphome
    password: !secret ota_password

# MQTT — publish raw ADC readings, broker handles distribution
mqtt:
  broker: 192.168.1.200      # Your MQTT broker IP
  port: 1883
  topic_prefix: plantpulse
  username: plantpulse
  password: !secret mqtt_password

# I2C bus for ADS1115
i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true

# ADS1115 16-bit ADC with PGA
ads1115:
  - address: 0x48

sensor:
  # Raw differential ADC reading (A0-A1) — no filters, browser does all processing
  - platform: ads1115
    multiplexer: 'A0_A1'
    gain: 0.256               # ±256mV range for max resolution on plant signals
    name: "Plant Signal"
    id: plant_signal
    update_interval: 250ms    # 4 readings/sec — balanced for ESP32 WiFi stability
    unit_of_measurement: "V"
    accuracy_decimals: 6
