<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlantPulse History</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/luxon@3"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cookie&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0d1117;
      color: #c9d1d9;
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      min-height: 100vh;
      padding: 20px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid #1e3a2a;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo img { height: 32px; }

    .logo h1 {
      font-size: 18px;
      color: #8b9dc3;
      font-weight: 400;
    }

    .logo h1 span {
      color: #c49b6c;
      font-family: 'Cookie', cursive;
      font-size: 22px;
    }

    .status {
      font-size: 11px;
      color: #5a8a6a;
    }

    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 16px;
      padding: 12px 16px;
      background: #111820;
      border: 1px solid #1e3a2a;
      border-radius: 8px;
    }

    .controls label {
      font-size: 11px;
      color: #5a8a6a;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .controls select, .controls input[type="datetime-local"] {
      background: #0d1117;
      color: #c9d1d9;
      border: 1px solid #1e3a2a;
      border-radius: 4px;
      padding: 5px 8px;
      font-family: inherit;
      font-size: 12px;
    }

    .quick-btn {
      background: #111820;
      color: #8b9dc3;
      border: 1px solid #1e3a2a;
      border-radius: 4px;
      padding: 5px 10px;
      font-family: inherit;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .quick-btn:hover { border-color: #c49b6c; color: #c49b6c; }
    .quick-btn.active { background: #1e3a2a; border-color: #c49b6c; color: #c49b6c; }

    .divider {
      width: 1px;
      height: 24px;
      background: #1e3a2a;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .stat-card {
      background: #111820;
      border: 1px solid #1e3a2a;
      border-radius: 8px;
      padding: 12px;
    }

    .stat-card .label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #5a8a6a;
      margin-bottom: 4px;
    }

    .stat-card .value {
      font-size: 18px;
      color: #c9d1d9;
    }

    .stat-card .unit {
      font-size: 11px;
      color: #5a8a6a;
    }

    .chart-panel {
      background: #111820;
      border: 1px solid #1e3a2a;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .chart-panel h3 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #5a8a6a;
      margin-bottom: 12px;
    }

    .chart-container {
      position: relative;
      height: 300px;
    }

    .chart-container.short {
      height: 150px;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #5a8a6a;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <img src="/logo.svg" alt="PlantPulse" onerror="this.style.display='none'">
      <h1>History — <span id="plantName">PlantPulse</span></h1>
    </div>
    <div class="status" id="status">Loading...</div>
  </header>

  <div class="controls">
    <label>Range:</label>
    <button class="quick-btn active" onclick="setRange('1h', this)">1H</button>
    <button class="quick-btn" onclick="setRange('3h', this)">3H</button>
    <button class="quick-btn" onclick="setRange('6h', this)">6H</button>
    <button class="quick-btn" onclick="setRange('12h', this)">12H</button>
    <button class="quick-btn" onclick="setRange('1d', this)">1D</button>
    <button class="quick-btn" onclick="setRange('3d', this)">3D</button>
    <button class="quick-btn" onclick="setRange('7d', this)">7D</button>
    <button class="quick-btn" onclick="setRange('all', this)">All</button>
    <div class="divider"></div>
    <label>Resolution:</label>
    <select id="resolution" onchange="fetchData()">
      <option value="auto">Auto</option>
      <option value="raw">Raw</option>
      <option value="5s">5s</option>
      <option value="1min">1 min</option>
      <option value="5min">5 min</option>
      <option value="1hour">1 hour</option>
    </select>
    <div class="divider"></div>
    <label>From:</label>
    <input type="datetime-local" id="startTime" onchange="fetchData()">
    <label>To:</label>
    <input type="datetime-local" id="endTime" onchange="fetchData()">
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="label">Readings</div>
      <div class="value" id="statReadings">--</div>
    </div>
    <div class="stat-card">
      <div class="label">Average</div>
      <div class="value" id="statAvg">-- <span class="unit">mV</span></div>
    </div>
    <div class="stat-card">
      <div class="label">Median</div>
      <div class="value" id="statMedian">-- <span class="unit">mV</span></div>
    </div>
    <div class="stat-card">
      <div class="label">Min</div>
      <div class="value" id="statMin">-- <span class="unit">mV</span></div>
    </div>
    <div class="stat-card">
      <div class="label">Max</div>
      <div class="value" id="statMax">-- <span class="unit">mV</span></div>
    </div>
    <div class="stat-card">
      <div class="label">Std Dev</div>
      <div class="value" id="statStddev">-- <span class="unit">mV</span></div>
    </div>
  </div>

  <div class="chart-panel">
    <h3>Signal History</h3>
    <div class="chart-container">
      <canvas id="mainChart"></canvas>
    </div>
  </div>

  <div class="chart-panel">
    <h3>Signal Range (Min / Max bands)</h3>
    <div class="chart-container short">
      <canvas id="rangeChart"></canvas>
    </div>
  </div>

  <script>
    const API = '';  // relative — same origin
    let currentRange = '1h';
    let mainChart, rangeChart;

    // Chart.js defaults for dark theme
    Chart.defaults.color = '#5a8a6a';
    Chart.defaults.borderColor = '#1e3a2a';

    function initCharts() {
      const mainCtx = document.getElementById('mainChart').getContext('2d');
      mainChart = new Chart(mainCtx, {
        type: 'line',
        data: {
          datasets: [{
            label: 'Voltage (mV)',
            data: [],
            borderColor: '#66bb6a',
            backgroundColor: 'rgba(102, 187, 106, 0.05)',
            borderWidth: 1.5,
            pointRadius: 0,
            fill: true,
            tension: 0.2,
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: false,
          interaction: { intersect: false, mode: 'index' },
          scales: {
            x: {
              type: 'time',
              time: { tooltipFormat: 'MMM d, yyyy HH:mm:ss' },
              grid: { color: '#1e3a2a22' },
            },
            y: {
              grid: { color: '#1e3a2a22' },
              title: { display: true, text: 'mV', color: '#5a8a6a' },
            }
          },
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: '#111820ee',
              borderColor: '#1e3a2a',
              borderWidth: 1,
            }
          }
        }
      });

      const rangeCtx = document.getElementById('rangeChart').getContext('2d');
      rangeChart = new Chart(rangeCtx, {
        type: 'line',
        data: {
          datasets: [
            {
              label: 'Max',
              data: [],
              borderColor: '#c49b6c88',
              backgroundColor: 'rgba(196, 155, 108, 0.1)',
              borderWidth: 1,
              pointRadius: 0,
              fill: '+1',
            },
            {
              label: 'Avg',
              data: [],
              borderColor: '#8b9dc3',
              borderWidth: 1.5,
              pointRadius: 0,
              fill: false,
            },
            {
              label: 'Min',
              data: [],
              borderColor: '#c49b6c88',
              borderWidth: 1,
              pointRadius: 0,
              fill: false,
            },
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: false,
          interaction: { intersect: false, mode: 'index' },
          scales: {
            x: {
              type: 'time',
              grid: { color: '#1e3a2a22' },
            },
            y: {
              grid: { color: '#1e3a2a22' },
              title: { display: true, text: 'mV', color: '#5a8a6a' },
            }
          },
          plugins: {
            legend: { labels: { boxWidth: 12, font: { size: 10 } } },
            tooltip: {
              backgroundColor: '#111820ee',
              borderColor: '#1e3a2a',
              borderWidth: 1,
            }
          }
        }
      });
    }

    function setRange(range, btn) {
      currentRange = range;
      document.querySelectorAll('.quick-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');

      const now = new Date();
      let start;
      switch (range) {
        case '1h': start = new Date(now - 3600000); break;
        case '3h': start = new Date(now - 3600000 * 3); break;
        case '6h': start = new Date(now - 3600000 * 6); break;
        case '12h': start = new Date(now - 3600000 * 12); break;
        case '1d': start = new Date(now - 86400000); break;
        case '3d': start = new Date(now - 86400000 * 3); break;
        case '7d': start = new Date(now - 86400000 * 7); break;
        case 'all': start = null; break;
      }

      if (start) {
        document.getElementById('startTime').value = toLocalISOString(start);
      } else {
        document.getElementById('startTime').value = '';
      }
      document.getElementById('endTime').value = toLocalISOString(now);
      fetchData();
    }

    function toLocalISOString(date) {
      const offset = date.getTimezoneOffset();
      const local = new Date(date.getTime() - offset * 60000);
      return local.toISOString().slice(0, 16);
    }

    async function fetchData() {
      const startEl = document.getElementById('startTime');
      const endEl = document.getElementById('endTime');
      const resolution = document.getElementById('resolution').value;

      let url = `${API}/api/data?resolution=${resolution}`;
      if (startEl.value) url += `&start=${new Date(startEl.value).toISOString()}`;
      if (endEl.value) url += `&end=${new Date(endEl.value).toISOString()}`;

      document.getElementById('status').textContent = 'Loading...';

      try {
        const [dataRes, statsRes] = await Promise.all([
          fetch(url),
          fetch(`${API}/api/stats?start=${new Date(startEl.value).toISOString()}&end=${new Date(endEl.value).toISOString()}`),
        ]);

        const data = await dataRes.json();
        const stats = await statsRes.json();

        updateStats(stats, data);
        updateCharts(data);

        document.getElementById('status').textContent =
          `${data.count.toLocaleString()} points @ ${data.resolution} resolution`;
      } catch (err) {
        document.getElementById('status').textContent = `Error: ${err.message}`;
      }
    }

    function updateStats(stats, data) {
      document.getElementById('statReadings').textContent = stats.readings?.toLocaleString() || '--';
      document.getElementById('statAvg').innerHTML = `${stats.avg_mv?.toFixed(3) || '--'} <span class="unit">mV</span>`;
      document.getElementById('statMedian').innerHTML = `${stats.median_mv?.toFixed(3) || '--'} <span class="unit">mV</span>`;
      document.getElementById('statMin').innerHTML = `${stats.min_mv?.toFixed(3) || '--'} <span class="unit">mV</span>`;
      document.getElementById('statMax').innerHTML = `${stats.max_mv?.toFixed(3) || '--'} <span class="unit">mV</span>`;
      document.getElementById('statStddev').innerHTML = `${stats.stddev_mv?.toFixed(3) || '--'} <span class="unit">mV</span>`;
    }

    function updateCharts(data) {
      // Main signal chart
      mainChart.data.datasets[0].data = data.data.map(d => ({
        x: new Date(d.time),
        y: d.voltage_mv,
      }));
      mainChart.update('none');

      // Range chart (only meaningful for aggregated data)
      if (data.data[0] && data.data[0].min_mv !== undefined) {
        rangeChart.data.datasets[0].data = data.data.map(d => ({ x: new Date(d.time), y: d.max_mv }));
        rangeChart.data.datasets[1].data = data.data.map(d => ({ x: new Date(d.time), y: d.voltage_mv }));
        rangeChart.data.datasets[2].data = data.data.map(d => ({ x: new Date(d.time), y: d.min_mv }));
      } else {
        // Raw data — just show the signal
        rangeChart.data.datasets[0].data = [];
        rangeChart.data.datasets[1].data = data.data.map(d => ({ x: new Date(d.time), y: d.voltage_mv }));
        rangeChart.data.datasets[2].data = [];
      }
      rangeChart.update('none');
    }

    // Init
    initCharts();
    setRange('1h', document.querySelector('.quick-btn'));
  </script>
</body>
</html>
