name: gate
on:
  push:
  pull_request:
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: gate (compile, json, composer laws, env, ports, nocdn, node tests)
        run: python3 tools/gate
      - name: docker build
        run: docker build -t plantpulse:ci .
